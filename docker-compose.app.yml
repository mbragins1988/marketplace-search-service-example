services:
  search-postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: search_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d search_db"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks:
      - marketplace

  search-service:
    build:
      context: .
    environment:
      POSTGRES_CONNECTION_STRING: postgresql+asyncpg://postgres:postgres@search-postgres:5432/search_db
      KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
      KAFKA_TOPIC_ADS: ${KAFKA_TOPIC_ADS:-marketplace.ads}
      KAFKA_CONSUMER_GROUP: search-service
      AD_SERVICE_URL: http://ad-service:8002
    ports:
      - "8003:8003"
    depends_on:
      search-postgres:
        condition: service_healthy
    networks:
      - marketplace

networks:
  marketplace:
    name: marketplace
    external: true

volumes:
  pgdata:
